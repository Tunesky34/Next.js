image: node:20.9.0

stages:
  - install
  - test
  - build
  - deploy

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .next/cache/

install_dependencies:
  stage: install
  script:
    - npm ci

lint_test:
  stage: test
  script:
    - npm run lint

build_project:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - cp -r out public
  artifacts:
    paths:
      - public/
  only:
    - main
