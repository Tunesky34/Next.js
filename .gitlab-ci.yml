stages:
  - install
  - test
  - security
  - build
  - deploy

default:
  image: node:20

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .next/cache/
    - .sonar/cache/

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

install_dependencies:
  stage: install
  script:
    - npm ci

lint_test:
  stage: test
  script:
    - npm run lint

sonarqube_check:
  stage: test
  script:
    - npm install -g sonarqube-scanner
    - npm run build
    - sonar-scanner
  only:
    - main
  allow_failure: true

snyk_security:
  stage: security
  script:
    - npm install -g snyk
    - export SNYK_TOKEN=$SNYK_TOKEN
    - snyk test --severity-threshold=high
    - snyk monitor
  allow_failure: true

build_project:
  stage: build
  script:
    - npm run build
    - npm run export
  artifacts:
    paths:
      - out/
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r out/* public/
  artifacts:
    paths:
      - public/
  only:
    - main
