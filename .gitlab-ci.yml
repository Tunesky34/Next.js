stages:
  - install
  - test
  - security
  - build
  - deploy

before_script:
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - node --version
  - npm --version

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .next/cache/

install_dependencies:
  stage: install
  script:
    - npm ci

lint_test:
  stage: test
  script:
    - npm run lint

sonarqube_scan:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner
  allow_failure: true

snyk_security:
  stage: security
  script:
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test --severity-threshold=high
    - snyk monitor
  allow_failure: true

build_project:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - cp -r out public
  artifacts:
    paths:
      - public/
  only:
    - main
