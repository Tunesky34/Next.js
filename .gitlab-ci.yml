image: node:20.9.0

stages:
  - install
  - test
  - build
  - deploy

# Cache node_modules to speed up subsequent runs
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .next/cache/

install_dependencies:
  stage: install
  script:
    - npm ci

lint_test:
  stage: test
  script:
    - npm run lint

build_project:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 week

deploy_job:
  stage: deploy
  script:
    - npm install -g pm2
    - pm2 start "npm run start" --name "next-app" || pm2 restart "next-app"
  only:
    - main
