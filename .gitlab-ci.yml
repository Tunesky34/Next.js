stages:
  - install
  - test
  - security
  - build
  - deploy

default:
  tags:
    - my-app

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - node_modules/
    - .sonar/cache/   # <-- add this
    - .next/cache/    # <-- optional, speeds up Next.js builds

install_dependencies:
  stage: install
  script:
    - npm ci

lint_test:
  stage: test
  script:
    - npm ci
    - npm run lint

sonarqube_check:
  stage: security
  script:
    - npm ci
    - npm run build
    - npx sonarqube-scanner
  allow_failure: true

snyk_security:
  stage: security
  script:
    - npm ci
    - npx snyk auth $SNYK_TOKEN
    - npx snyk test --severity-threshold=high
  allow_failure: true

build_project:
  stage: build
  script:
    - npm ci
    - npm run build

pages:
  stage: deploy
  script:
    - mkdir -p public
    - echo "GitLab Pages deployed successfully" > public/index.html
  artifacts:
    paths:
      - public/