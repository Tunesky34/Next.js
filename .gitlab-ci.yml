stages:
  - install
  - test
  - security
  - build
  - deploy

default:
  image: node:20
  tags:
    - my-app

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - node_modules/
    - .npm/

install_dependencies:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

lint_test:
  stage: test
  dependencies:
    - install_dependencies
  script:
    - npm run lint

sonarqube_check:
  stage: security
  dependencies:
    - install_dependencies
  script:
    - npm run build
    - npx sonarqube-scanner
  allow_failure: true

snyk_security:
  stage: security
  dependencies:
    - install_dependencies
  script:
    - npx snyk auth $SNYK_TOKEN
    - npx snyk test --severity-threshold=high
  allow_failure: true

build_project:
  stage: build
  dependencies:
    - install_dependencies
  script:
    - npm run build

pages:
  stage: deploy
  script:
    - mkdir -p public
    - echo "GitLab Pages deployed successfully" > public/index.html
  artifacts:
    paths:
      - public/